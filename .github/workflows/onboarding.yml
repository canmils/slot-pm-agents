name: Onboarding checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/portfolio_review/analyze.py --output-dir output/portfolio-review
      - run: python examples/portfolio_review/prepare_agent_input.py --summary output/portfolio-review/summary.json --output output/portfolio-review/agent-input.json
